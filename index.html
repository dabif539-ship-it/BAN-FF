<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAKI Account Banning</title>
    <style>
        /* استيراد خطوط غامضة وهاكر */
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cairo:wght@400;700;900&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* خلفية الهاكر كاملة الشاشة */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            opacity: 0.2;
        }

        /* شاشة المقدمة الديناميكية */
        #introScreen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease;
            text-align: center;
            padding: 20px;
            border: 5px solid #ff0000;
            box-sizing: border-box;
        }
        #introScreen h2 {
            color: #ff0000;
            font-size: 2rem;
            font-family: 'Share Tech Mono', monospace;
            text-shadow: 0 0 20px rgba(255,0,0,0.8);
            margin-bottom: 20px;
            animation: pulseWarning 1s infinite alternate;
        }
        #introScreen p {
            color: #00ff00;
            font-size: 1.2rem;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0,255,0,0.5);
        }
        @keyframes pulseWarning {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.05); opacity: 1; }
        }

        /* رسالة الخطأ المخصصة */
        #customAlert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ff0000;
            color: #fff;
            padding: 15px 30px;
            border-radius: 5px;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            z-index: 10000;
            display: none;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.9);
            border: 2px solid #fff;
            text-transform: uppercase;
        }
        @keyframes shake {
            0% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(2deg); }
            50% { transform: translateX(-50%) rotate(-2deg); }
            75% { transform: translateX(-50%) rotate(2deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }

        /* النافذة الرئيسية */
        .container {
            width: 95%;
            max-width: 800px;
            text-align: center;
            padding: 40px 20px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.1), inset 0 0 30px rgba(0, 255, 0, 0.05);
            background: rgba(0, 10, 0, 0.7);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            position: relative;
            z-index: 10;
            display: none;
        }

        /* عنوان ZAKI ثلاثي الأبعاد وفخم */
        .title-container {
            perspective: 1000px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        h1 {
            font-size: 3.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin: 0;
        }

        .zaki-3d {
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            color: #00ff00;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
            letter-spacing: 4px;
            text-shadow: 
                1px 1px 0 #009900,
                2px 2px 0 #008800,
                3px 3px 0 #007700,
                4px 4px 0 #006600,
                5px 5px 0 #005500,
                6px 6px 0 #004400,
                7px 7px 0 #003300,
                8px 8px 0 #002200,
                9px 9px 0 #001100,
                10px 10px 15px rgba(0,0,0,0.8),
                0 0 35px rgba(0,255,0,0.8);
            animation: float3D 4s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        @keyframes float3D {
            0%, 100% { transform: rotateY(-15deg) rotateX(5deg) translateY(0); }
            50% { transform: rotateY(15deg) rotateX(5deg) translateY(-10px); }
        }

        h1 span.title-text {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            font-size: 1.8rem;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 1rem;
            font-family: 'Share Tech Mono', monospace;
            color: #00ff00;
            letter-spacing: 4px;
            margin-bottom: 40px;
            opacity: 0.7;
            text-transform: uppercase;
        }

        /* شريط التحميل */
        .loader-box {
            display: none;
            width: 80%;
            margin: 20px auto;
            position: relative;
            height: 25px;
            background: #000;
            border: 1px solid #00ff00;
            border-radius: 3px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                #00ff00,
                #00ff00 10px,
                #003300 10px,
                #003300 20px
            );
            transition: width 0.1s linear;
            box-shadow: 0 0 15px #00ff00;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            color: #fff;
            text-shadow: 1px 1px 3px #000, 0 0 10px #00ff00;
            z-index: 2;
        }

        .search-container, .result-section, .developer-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            transition: all 0.3s ease;
        }

        input[type="text"], input[type="password"] {
            width: 80%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff00;
            color: #00ff00;
            font-size: 1.2rem;
            font-family: 'Share Tech Mono', monospace;
            border-radius: 5px;
            text-align: center;
            outline: none;
            transition: 0.3s;
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.2);
        }

        input:focus {
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.6), inset 0 0 15px rgba(0, 255, 0, 0.3);
            background: rgba(0, 20, 0, 0.9);
        }

        input::placeholder {
            color: rgba(0, 255, 0, 0.4);
        }

        button {
            padding: 15px 40px;
            background: #000;
            color: #00ff00;
            border: 2px solid #00ff00;
            font-size: 1.1rem;
            font-weight: bold;
            font-family: 'Share Tech Mono', monospace;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: rgba(0, 255, 0, 0.2);
            transition: 0.3s;
        }

        button:hover::before {
            left: 0;
        }

        button:hover {
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
            background: #00ff00;
            color: #000;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(0, 20, 0, 0.9), rgba(0, 0, 0, 0.95));
            padding: 40px;
            border: 1px solid #00ff00;
            border-radius: 10px;
            text-align: center;
            width: 350px;
            box-shadow: 0 0 50px rgba(0, 255, 0, 0.4), inset 0 0 20px rgba(0, 255, 0, 0.1);
        }

        .modal-content h3 {
            margin-top: 0;
            color: #00ff00;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .modal-content p {
            color: #888;
            font-size: 0.9rem;
            font-family: 'Share Tech Mono', monospace;
        }

        .image-container {
            width: 100%;
            border: 1px solid #00ff00;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 255, 0, 0.2), inset 0 0 20px rgba(0, 255, 0, 0.1);
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .image-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.15),
                rgba(0, 0, 0, 0.15) 1px,
                transparent 1px,
                transparent 2px
            );
            pointer-events: none;
        }

        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            transition: 0.5s ease;
            filter: contrast(1.2) brightness(0.9);
        }

        .button-group {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn-ban {
            border-color: #ff0000;
            color: #ff0000;
        }
        .btn-ban:hover {
            background: #ff0000;
            color: #fff;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
        }
        .btn-ban::before {
            background: rgba(255, 0, 0, 0.2);
        }

        .btn-unban {
            border-color: #00ff00;
            color: #00ff00;
        }
        .btn-unban:hover {
            background: #00ff00;
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.8);
        }

        .action-status {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.4rem;
            font-family: 'Share Tech Mono', monospace;
            min-height: 30px;
            letter-spacing: 2px;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .dev-message {
            color: #ff3333;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'Share Tech Mono', monospace;
            margin-top: 10px;
            text-shadow: 0 0 20px rgba(255, 51, 51, 0.9);
            animation: pulseWarning 1s infinite alternate;
        }
    </style>
</head>
<body>

    <!-- خلفية الهاكر -->
    <canvas id="matrixCanvas"></canvas>

    <!-- موسيقى الخلفية (تعمل تلقائياً) -->
    <audio id="bgMusic" loop>
        <source src="5.mp3" type="audio/mpeg">
    </audio>

    <!-- شاشة المقدمة -->
    <div id="introScreen">
        <h2>⚠️ هذا الموقع خطير رجاء الحذر اثناء استخدام !</h2>
        <p>تم التصميم بالكامل من قبل : براهمي زكرياء</p>
    </div>

    <!-- رسالة الخطأ المخصصة -->
    <div id="customAlert"></div>

    <div class="container" id="mainApp">
        <div class="title-container">
            <h1>
                <span class="zaki-3d">ZAKI</span>
                <span class="title-text">Account Banning</span>
            </h1>
        </div>
        <div class="subtitle">نظام الحظر الغامض - الإصدار 7.0</div>

        <!-- صندوق البحث -->
        <div class="search-container" id="searchContainer">
            <input type="text" id="ffId" placeholder="ENTER FREE FIRE ID..." autocomplete="off">
            <button onclick="promptPassword()">بحث</button>
            
            <!-- شريط تحميل البحث -->
            <div class="loader-box" id="searchLoader">
                <div class="progress-bar" id="searchProgress"></div>
                <span class="progress-text" id="searchPercent">0%</span>
            </div>
        </div>

        <!-- نافذة كلمة المرور -->
        <div class="modal" id="passwordModal">
            <div class="modal-content">
                <h3>منطقة محظورة</h3>
                <p>أدخل مفتاح الوصول للمتابعة</p>
                <input type="password" id="passInput" placeholder="........" autocomplete="off">
                <button onclick="verifyPassword()" style="margin-top: 15px; width: 100%;">تأكيد المفتاح</button>
            </div>
        </div>

        <!-- قسم طلب الصلاحية -->
        <div class="developer-section" id="developerSection" style="display: none;">
            <div class="image-container">
                <img id="devImage" src="3.png" alt="Contact Developer">
            </div>
            <div class="dev-message">تواصل مع المطور ليعطيك صلاحية</div>
        </div>

        <!-- قسم النتائج -->
        <div class="result-section" id="resultSection" style="display: none;">
            <div class="image-container">
                <img id="statusImage" src="1.png" alt="Account Status">
            </div>

            <div class="button-group" id="actionButtons">
                <button class="btn-ban" onclick="startBanAction('ban')">تبنيد</button>
                <button class="btn-unban" onclick="startBanAction('unban')">فتح البان</button>
            </div>

            <!-- شريط تحميل التبنيد/فتح البان -->
            <div class="loader-box" id="actionLoader" style="margin-top: 15px;">
                <div class="progress-bar" id="actionProgress"></div>
                <span class="progress-text" id="actionPercent">0%</span>
            </div>

            <div class="action-status" id="actionStatus"></div>
        </div>
    </div>

    <script>
        // ===== إعدادات الموقع =====
        const CORRECT_PASSWORD = "zaki3amiw3amlgami3";
        const TARGET_ID = "6910522604";

        // ===== تشغيل الموسيقى دائماً =====
        const audio = document.getElementById('bgMusic');
        audio.volume = 0.4; // مستوى الصوت

        audio.play().catch(e => console.log("المتصفح منع التشغيل التلقائي. في انتظار تفاعل المستخدم..."));

        function playAudioOnInteraction() {
            if (audio.paused) {
                audio.play().catch(e => console.log("فشل التشغيل:", e));
            }
            document.removeEventListener('click', playAudioOnInteraction);
            document.removeEventListener('touchstart', playAudioOnInteraction);
            document.removeEventListener('keydown', playAudioOnInteraction);
        }

        document.addEventListener('click', playAudioOnInteraction);
        document.addEventListener('touchstart', playAudioOnInteraction);
        document.addEventListener('keydown', playAudioOnInteraction);

        // ===== شاشة المقدمة =====
        window.onload = () => {
            setTimeout(() => {
                const intro = document.getElementById('introScreen');
                intro.style.opacity = '0';
                setTimeout(() => {
                    intro.style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                }, 1000);
            }, 4000);
        };

        // ===== خلفية الهاكر =====
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%';
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        let drops = [];

        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#00ff00';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 35);

        // ===== رسالة الخطأ المخصصة =====
        function showAlert(message) {
            const alertBox = document.getElementById('customAlert');
            alertBox.innerText = message;
            alertBox.style.display = 'block';
            alertBox.style.animation = 'shake 0.5s';
            setTimeout(() => {
                alertBox.style.animation = '';
                alertBox.style.display = 'none';
            }, 3000);
        }

        // ===== شريط التحميل =====
        function startLoading(loaderId, barId, percentId, callback) {
            const loader = document.getElementById(loaderId);
            const bar = document.getElementById(barId);
            const percentText = document.getElementById(percentId);
            
            loader.style.display = 'block';
            let progress = 0;
            bar.style.width = '0%';
            percentText.innerText = '0%';

            const interval = setInterval(() => {
                progress++;
                bar.style.width = progress + '%';
                percentText.innerText = progress + '%';
                
                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => {
                        loader.style.display = 'none';
                        if (callback) callback();
                    }, 300);
                }
            }, 50); // 5 ثواني
        }

        // ===== وظائف الموقع =====
        function promptPassword() {
            const ffId = document.getElementById('ffId').value.trim();
            
            // التحقق من طول الايدي (8 إلى 14)
            if (ffId.length < 8 || ffId.length > 14) {
                showAlert("خطئ");
                return;
            }

            // إخفاء صندوق البحث وإظهار شريط التحميل
            document.getElementById('searchContainer').querySelector('input').style.display = 'none';
            document.getElementById('searchContainer').querySelector('button').style.display = 'none';
            
            startLoading('searchLoader', 'searchProgress', 'searchPercent', () => {
                document.getElementById('searchContainer').querySelector('input').style.display = 'block';
                document.getElementById('searchContainer').querySelector('button').style.display = 'block';
                
                document.getElementById('passwordModal').style.display = 'flex';
                document.getElementById('passInput').value = ''; 
                document.getElementById('passInput').focus();
            });
        }

        function verifyPassword() {
            const enteredPass = document.getElementById('passInput').value;
            const enteredId = document.getElementById('ffId').value.trim();

            if (enteredPass === CORRECT_PASSWORD) {
                document.getElementById('passwordModal').style.display = 'none';
                document.getElementById('searchContainer').style.display = 'none';
                
                if (enteredId === TARGET_ID) {
                    document.getElementById('resultSection').style.display = 'flex';
                } else {
                    document.getElementById('developerSection').style.display = 'flex';
                }
            } else {
                showAlert("مفتاح خاطئ! تم تسجيل محاولة الدخول.");
            }
        }

        // ===== التبنيد وفتح البان =====
        function startBanAction(action) {
            document.getElementById('actionButtons').style.display = 'none';
            document.getElementById('actionStatus').innerText = "جاري المعالجة...";
            document.getElementById('actionStatus').style.color = "#fff";
            document.getElementById('actionStatus').style.textShadow = "none";
            document.getElementById('statusImage').style.opacity = '0.3';
            document.getElementById('statusImage').style.filter = 'blur(5px)';

            startLoading('actionLoader', 'actionProgress', 'actionPercent', () => {
                const imgElement = document.getElementById('statusImage');
                const statusDiv = document.getElementById('actionStatus');
                
                imgElement.style.opacity = '1';
                imgElement.style.filter = 'contrast(1.2) brightness(0.9)';
                document.getElementById('actionButtons').style.display = 'flex';

                if (action === 'unban') {
                    imgElement.src = "2.png";
                    statusDiv.innerText = "تم فتح البان";
                    statusDiv.style.color = "#00ff00"; 
                    statusDiv.style.textShadow = "0 0 15px rgba(0,255,0,0.9)";
                } else {
                    imgElement.src = "1.png";
                    statusDiv.innerText = "تم تبنيد";
                    statusDiv.style.color = "#ff0000"; 
                    statusDiv.style.textShadow = "0 0 15px rgba(255,0,0,0.9)";
                }
            });
        }

        // اختصارات لوحة المفاتيح
        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') verifyPassword();
        });

        document.getElementById('ffId').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') promptPassword();
        });
    </script>
</body>
</html>
